name: Deploy GitHub Pages redirects

# Re‑run on every push to main (adjust branch name as needed)
on:
  push:
    branches: [main]

permissions:
  contents: read          # for checkout
  pages: write            # to push to Pages
  id-token: write         # to authenticate deployment

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build

      # Only GitHub Pages receives redirects; Cloudflare still publishes out/.
      - run: node scripts/generate-github-pages-redirects.js

      # Keep old page paths working after the move to Cloudflare.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out-github-redirects

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
